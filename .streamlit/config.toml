[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Identidade visual "nie" (paleta em src/assets/README.md).
[theme]
base = "dark"
primaryColor = "#F2A541"
backgroundColor = "#0D1624"
secondaryBackgroundColor = "#16233A"
textColor = "#F2F5F9"
borderColor = "#2A3B55"
linkColor = "#F2A541"
dataframeHeaderBackgroundColor = "#16233A"
baseRadius = "8px"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap"
chartCategoricalColors = ["#F2A541", "#3DBFA8", "#7B95FF", "#E8664A", "#8FA1B8"]

[theme.sidebar]
backgroundColor = "#101B2C"
secondaryBackgroundColor = "#16233A"
