<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>SEI falso - Controle de Processos (testes)</title></head>
<body>
  <!-- Pesquisa rápida do topo do SEI. O onsubmit marca que a rotina do SEI rodou. -->
  <form id="frmProtocoloPesquisaRapida" action="controlador.html" method="get"
        onsubmit="sessionStorage.setItem('teste_onsubmit_rodou', '1')">
    <input type="hidden" name="acao" value="procedimento_trabalhar">
    <input type="text" id="txtPesquisaRapida" name="txtPesquisaRapida">
  </form>
  <p>Controle de Processos</p>
</body>
</html>
